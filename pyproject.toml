[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "makemarketbench"
version = "0.1.0"
description = "MakeMarketBench: can LLMs make markets under adverse selection? Quote-setting games scored against a Bayes reference quoter."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicolas Coquelet" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mmb = "makemarket.cli:main"

[tool.scikit-build]
wheel.packages = ["src/makemarket"]
cmake.build-type = "Release"
minimum-version = "0.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
